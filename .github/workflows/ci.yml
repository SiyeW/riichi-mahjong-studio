name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    name: Studio checks (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: ""
          auto-activate: false
          run-init: false
          channels: conda-forge
          conda-remove-defaults: "true"
          miniforge-version: 26.7.2-1

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Python dependencies
        shell: pwsh
        run: |
          conda create --yes --override-channels --channel conda-forge `
            --prefix .conda-backend --file packaging/windows/environment-win-64.lock
          .\.conda-backend\python.exe -m pip install -r packaging/windows/requirements-release.txt

      - name: Install Chromium for renderer tests
        run: npx playwright install chromium

      - name: Run project checks
        run: npm run check
