name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-release.txt

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -r requirements-release.txt

      - name: Install Chromium for renderer tests
        run: npx playwright install chromium

      - name: Run project checks
        run: npm run check
