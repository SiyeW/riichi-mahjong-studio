<!doctype html>
<html><head><meta charset="utf-8"><title>Isolated tile artwork check</title></head>
<body><div id="app"></div><script type="module">
import { createApp, h, nextTick, onMounted, ref } from 'vue'
import { useTileArtwork } from '/src/useTileArtwork.ts'
import '/src/styles.css'
import '/src/styles/TableScene.css'

const uiScale = ref(1)
const faces = ['1m', '2m', '5mr', '8p', '1s', '7s', 'E', 'C', '?']
const app = createApp({
  setup() {
    const artwork = useTileArtwork(key => key, uiScale)
    onMounted(() => { void artwork.prepareTileArtwork() })
    window.artworkTest = { artwork, uiScale, unmount: () => app.unmount(), nextTick }
    return () => h('div', { class: 'shell', style: { '--ui-scale': uiScale.value } }, [
      h('div', { class: 'tiles', style: { display: 'flex', gap: '2px', '--tile-img-w': '60px', '--tile-img-h': '80px' } },
        faces.map(face => h('img', { class: 'tileImg', alt: face, src: artwork.tileImageSrc(face) }))),
      h('span', { id: 'ready' }, String(artwork.tileArtworkReady.value)),
    ])
  },
})
app.mount('#app')
</script></body></html>
